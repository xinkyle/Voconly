name: Publish to SourceForge

# 触发条件：
# 1. 手动触发 - 在 GitHub Actions 页面点击 "Run workflow"，输入版本号
# 2. 自动触发 - 当 release 发布时自动触发
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 0.5.19)'
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-to-sourceforge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get release info
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 根据触发方式获取版本号
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发：使用输入的版本号
            VERSION="${{ github.event.inputs.version }}"
            echo "手动触发，版本号: ${VERSION}"
          else
            # Release 触发：从 tag 提取版本号
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Release 触发，版本号: ${VERSION}"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

          # 验证 release 是否存在
          echo "检查 release v${VERSION} 是否存在..."
          gh release view "v${VERSION}" --repo "${{ github.repository }}" || {
            echo "❌ 错误：Release v${VERSION} 不存在！"
            exit 1
          }

      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.release.outputs.VERSION }}"

          # 创建目录
          mkdir -p release-assets

          # 下载指定版本的所有 release 资产
          echo "下载 release v${VERSION} 的文件..."
          gh release download "v${VERSION}" \
            --dir release-assets \
            --repo "${{ github.repository }}"

          echo ""
          echo "✅ 下载完成，文件列表："
          ls -lh release-assets/

      - name: Setup SSH for SourceForge
        env:
          SF_SSH_KEY_BASE64: ${{ secrets.SF_SSH_KEY_BASE64 }}
        run: |
          set -x  # 打印每个命令

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # 调试：检查 base64 字符串长度
          echo "Base64 字符串长度: ${#SF_SSH_KEY_BASE64}"

          # 从 base64 解码私钥，保留原始格式
          echo "$SF_SSH_KEY_BASE64" | base64 -d > ~/.ssh/id_rsa || {
            echo "❌ Base64 解码失败"
            exit 1
          }

          chmod 600 ~/.ssh/id_rsa

          # 检查文件是否创建
          if [ ! -f ~/.ssh/id_rsa ]; then
            echo "❌ 私钥文件未创建"
            exit 1
          fi

          # 添加 SourceForge 到 known_hosts（失败不影响流程）
          ssh-keyscan shell.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

          # 验证私钥文件
          echo "验证私钥文件..."
          echo "文件大小: $(wc -c < ~/.ssh/id_rsa) 字节"
          echo "行数: $(wc -l < ~/.ssh/id_rsa) 行"
          echo "前 3 行内容:"
          head -n 3 ~/.ssh/id_rsa

          # 测试私钥是否有效
          if ssh-keygen -l -f ~/.ssh/id_rsa 2>/dev/null; then
            echo "✅ 私钥格式有效"
          else
            echo "❌ 私钥格式无效"
            echo ""
            echo "请检查 GitHub Secret 中的 SF_SSH_KEY_BASE64："
            echo "- 是否使用了 base64 编码"
            echo "- 编码命令: cat 私钥文件 | base64 -w 0"
            exit 1
          fi

          # 测试 SSH 连接
          echo ""
          echo "测试 SSH 连接到 SourceForge..."
          ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=no ${{ secrets.SF_USERNAME }}@shell.sourceforge.net "echo 'SSH连接成功'" || {
            echo ""
            echo "❌ SSH 连接失败"
            echo ""
            echo "可能的原因："
            echo "1. SSH 公钥未添加到 SourceForge"
            echo "2. 用户名不正确"
            echo "3. SourceForge Shell 服务未激活"
            echo ""
            echo "请检查："
            echo "- SourceForge: Me → Settings → SSH Settings"
            echo "- 确保已添加对应的公钥"
            exit 1
          }

      - name: Upload to SourceForge via SSH
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          VERSION: ${{ steps.release.outputs.VERSION }}
        run: |
          PROJECT_NAME="voconly"
          FRS_PATH="/home/frs/project/${PROJECT_NAME}/${VERSION}"

          echo "项目: ${PROJECT_NAME}"
          echo "版本: ${VERSION}"
          echo "路径: ${FRS_PATH}"

          # 创建远程目录
          echo "创建远程目录..."
          ssh ${SF_USERNAME}@shell.sourceforge.net "mkdir -p ${FRS_PATH}"

          # 使用 rsync 上传文件（比 scp 更可靠，支持断点续传）
          echo "开始上传文件..."
          rsync -avP --progress release-assets/ ${SF_USERNAME}@shell.sourceforge.net:${FRS_PATH}/

          echo ""
          echo "✅ 上传完成！"
          echo "文件列表："
          ssh ${SF_USERNAME}@shell.sourceforge.net "ls -lh ${FRS_PATH}/"

          echo ""
          echo "🔗 访问: https://sourceforge.net/projects/${PROJECT_NAME}/files/${VERSION}/"

      - name: Summary
        run: |
          VERSION="${{ steps.release.outputs.VERSION }}"
          echo "## 发布到 SourceForge 完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "版本: v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SourceForge 文件页面：https://sourceforge.net/projects/voconly/files/${VERSION}/" >> $GITHUB_STEP_SUMMARY