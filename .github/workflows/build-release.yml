name: Build and Release

# 触发条件：
# 1. 手动触发（推荐）- 在 GitHub Actions 页面点击 "Run workflow"
# 2. 推送 tag（可选）- 推送 v* 开头的 tag 时自动触发
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 0.5.10)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

# 添加权限配置，允许创建 release
permissions:
  contents: write

jobs:
  # ========================================
  # 构建 Windows 版本
  # ========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.0.0
        with:
          vulkan_version: 1.3.296.0

      - name: Install SPIRV-Headers
        shell: pwsh
        run: |
          # 克隆 SPIRV-Headers
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git C:\SPIRV-Headers-src
          # 构建并安装
          mkdir C:\SPIRV-Headers-src\build
          cd C:\SPIRV-Headers-src\build
          cmake .. -DCMAKE_INSTALL_PREFIX=C:\SPIRV-Headers
          cmake --build . --config Release --target install
          # 设置环境变量
          echo "SPIRV_HEADERS_DIR=C:\SPIRV-Headers" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=C:\SPIRV-Headers" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: pnpm install

      - name: Update version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          $cargoPath = "src-tauri/Cargo.toml"
          # 读取文件内容
          $lines = Get-Content $cargoPath
          # 找到 [package] 后的第一个 version 行并替换
          $inPackage = $false
          $updated = $false
          $newLines = @()
          foreach ($line in $lines) {
            if ($line -match '^\[package\]') {
              $inPackage = $true
            } elseif ($line -match '^\[') {
              $inPackage = $false
            }
            if ($inPackage -and $line -match '^version\s*=\s*"[^"]*"' -and -not $updated) {
              $line = "version = `"$version`""
              $updated = $true
            }
            $newLines += $line
          }
          $newLines | Set-Content $cargoPath
          Write-Host "Updated version to $version"
          # 验证修改
          Get-Content $cargoPath | Select-Object -First 5

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          retention-days: 1

  # ========================================
  # 构建 macOS 版本
  # ========================================
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Update version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          $cargoPath = "src-tauri/Cargo.toml"
          # 读取文件内容
          $lines = Get-Content $cargoPath
          # 找到 [package] 后的第一个 version 行并替换
          $inPackage = $false
          $updated = $false
          $newLines = @()
          foreach ($line in $lines) {
            if ($line -match '^\[package\]') {
              $inPackage = $true
            } elseif ($line -match '^\[') {
              $inPackage = $false
            }
            if ($inPackage -and $line -match '^version\s*=\s*"[^"]*"' -and -not $updated) {
              $line = "version = `"$version`""
              $updated = $true
            }
            $newLines += $line
          }
          $newLines | Set-Content $cargoPath
          Write-Host "Updated version to $version"
          # 验证修改
          Get-Content $cargoPath | Select-Object -First 5

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri build --target aarch64-apple-darwin

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg.sig
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Voconly.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Voconly.app.tar.gz.sig
          retention-days: 1

  # ========================================
  # 创建 Release 并上传所有文件
  # ========================================
  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: windows-artifacts

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: macos-artifacts

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Get current date
        id: date
        run: echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Extract changelog for current version
        id: changelog
        run: |
          # 从 CHANGELOG.md 提取当前版本的更新内容
          # 使用 === 作为版本分隔符，提取第一个分隔符之前的内容
          NOTES=$(awk '/^===$/{exit} {print}' CHANGELOG.md | tail -n +2)

          # 如果没有找到内容，使用默认内容
          if [ -z "$NOTES" ]; then
            NOTES="更新内容请查看提交历史。"
          fi

          # 将多行内容保存到文件
          echo "$NOTES" > /tmp/release_notes.md

          # 输出到 GitHub output（用于显示）
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Read signatures
        id: signatures
        run: |
          # 读取 Windows 签名
          WINDOWS_SIG=""
          if [ -f windows-artifacts/*.exe.sig ]; then
            WINDOWS_SIG=$(cat windows-artifacts/*.exe.sig | base64 -w0)
          fi
          echo "windows_signature=$WINDOWS_SIG" >> $GITHUB_OUTPUT

          # 读取 macOS 签名
          MACOS_SIG=""
          if [ -f macos-artifacts/*.app.tar.gz.sig ]; then
            MACOS_SIG=$(cat macos-artifacts/*.app.tar.gz.sig | base64 -w0)
          fi
          echo "macos_signature=$MACOS_SIG" >> $GITHUB_OUTPUT

      - name: Generate latest.json
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          DATE="${{ steps.date.outputs.DATE }}"
          WINDOWS_SIG="${{ steps.signatures.outputs.windows_signature }}"
          MACOS_SIG="${{ steps.signatures.outputs.macos_signature }}"

          # 读取 release notes
          NOTES=$(cat /tmp/release_notes.md | jq -Rs .)

          # 获取实际的文件名
          WINDOWS_FILE=$(ls windows-artifacts/*.exe | head -n1 | xargs basename)
          MACOS_FILE=$(ls macos-artifacts/*.dmg | head -n1 | xargs basename)

          # 生成 latest.json
          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "date": "$DATE",
            "notes": $NOTES,
            "platforms": {
              "windows-x86_64": {
                "url": "https://github.com/xinkyle/Voconly/releases/download/v$VERSION/$WINDOWS_FILE",
                "signature": "$WINDOWS_SIG"
              },
              "darwin-aarch64": {
                "url": "https://github.com/xinkyle/Voconly/releases/download/v$VERSION/$MACOS_FILE",
                "signature": "$MACOS_SIG"
              }
            }
          }
          EOF

          echo "Generated latest.json:"
          cat latest.json

      - name: Prepare release files
        run: |
          mkdir -p release-files
          cp windows-artifacts/*.exe release-files/ 2>/dev/null || true
          cp macos-artifacts/*.dmg release-files/ 2>/dev/null || true
          cp latest.json release-files/ 2>/dev/null || true
          ls -la release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Voconly v${{ steps.version.outputs.VERSION }}
          body: |
            ## 更新内容

            ${{ steps.changelog.outputs.notes }}

            ## 下载

            | 平台 | 文件 |
            |------|------|
            | Windows | `Voconly_${{ steps.version.outputs.VERSION }}_x64-setup.exe` |
            | macOS (Apple Silicon) | `Voconly_${{ steps.version.outputs.VERSION }}_aarch64.dmg` |

            ## 自动更新

            已发布 `latest.json` 用于应用内更新检测。
          files: release-files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## 发布完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "版本: v${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 发布的文件" >> $GITHUB_STEP_SUMMARY
          ls -la release-files/ >> $GITHUB_STEP_SUMMARY