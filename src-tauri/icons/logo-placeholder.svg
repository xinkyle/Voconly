<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Voconly Logo Placeholder -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#logoGradient)"/>

  <!-- Microphone Icon -->
  <g fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mic body -->
    <rect x="12" y="8" width="8" height="10" rx="4"/>
    <!-- Mic base -->
    <path d="M8 16c0 4 3 6 8 6s8-2 8-6"/>
    <!-- Mic stand -->
    <path d="M16 22v3"/>
    <path d="M13 25h6"/>
  </g>

  <!-- Sound waves (suggesting freedom/speech) -->
  <g fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <path d="M22 12c2 0 3 1.5 3 3s-1 3-3 3"/>
    <path d="M24 10c3 0 5 2.5 5 5s-2 5-5 5"/>
  </g>
</svg>
